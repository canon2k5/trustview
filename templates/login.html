<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login — TrustView</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">🛡️ TrustView</div>
      <p class="login-subtitle">Admin access — enter your password</p>

      {% if message %}
        <div class="login-error">{{ message }}</div>
      {% endif %}

      <form method="POST">
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autofocus>
        </div>
        <button type="submit" class="btn login-btn">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
